name: Continuous Integration

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run test

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: "latest"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: go test --race ./...
      - run: go vet ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - name: Install Task
        uses: go-task/setup-task@v2
      - run: task build

  acceptance:
    name: Deployment and browser acceptance
    needs: [build]
    if: github.repository == 'Anigx/filebrowser' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Chromium and build binary
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run build
          go build -o "$RUNNER_TEMP/filebrowser" .
      - name: Verify security-key login
        run: |
          QA_FILEBROWSER_BIN="$RUNNER_TEMP/filebrowser" python tests/e2e/security_key.py
          QA_BASE_PATH='' QA_FILEBROWSER_BIN="$RUNNER_TEMP/filebrowser" python tests/e2e/security_key.py
      - name: Verify disposable deployment and restore
        env:
          FILEBROWSER_IMAGE: filebrowser-acceptance:${{ github.sha }}
          FB_WEBAUTHN_ORIGIN: "http://localhost:8000"
          QA_CONTAINER: filebrowser-ci-filebrowser-1
          QA_CHROMIUM: ""
          QA_ROTATE_DURING_UPLOAD: "1"
        run: |
          set -ex
          docker compose --env-file .env.example config --quiet
          docker build --build-arg COMMIT_SHA="$(git rev-parse --short HEAD)" \
            --build-arg VERSION=ci -t "$FILEBROWSER_IMAGE" .
          {
            printf 'Commit: %s\n' "$(git rev-parse HEAD)"
            docker image inspect "$FILEBROWSER_IMAGE" --format 'Image: {{.Id}} ({{.Os}}/{{.Architecture}})'
          } >> "$GITHUB_STEP_SUMMARY"
          sh docker/test-healthcheck.sh "$FILEBROWSER_IMAGE"
          sh docker/test-deployment.sh "$FILEBROWSER_IMAGE"
          sudo env QA_IMAGE="$FILEBROWSER_IMAGE" "$(command -v python)" tests/e2e/restore.py
          sudo install -d -o 1000 -g 1000 -m 0750 srv
          trap 'docker compose -p filebrowser-ci down --volumes' EXIT
          docker compose -p filebrowser-ci up -d --wait
          curl --fail --silent --show-error http://localhost:8000/ | grep -Fq '"WebAuthn":true'
          python tests/e2e/browser_smoke.py
          python tests/e2e/auth_tabs.py

  release:
    name: Release
    needs: [lint-frontend, test-frontend, lint-backend, test, build, acceptance]
    if: github.repository == 'Anigx/filebrowser' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - name: Install Task
        uses: go-task/setup-task@v2
      - run: task build:frontend
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



