services:
  filebrowser:
    # Use the local develop image by default. Set FILEBROWSER_IMAGE only when
    # intentionally selecting a built or registry-hosted tag.
    image: ${FILEBROWSER_IMAGE:-anigx/filebrowser:develop-local}
    ports:
      # Keep File Browser private to this host; expose it through a trusted
      # reverse proxy or tunnel rather than binding it to every interface.
      - "127.0.0.1:8000:80"
    volumes:
      # Prepare this directory for the image's unprivileged UID/GID (1000:1000).
      - type: bind
        source: ./srv
        target: /srv
        bind:
          create_host_path: false
      - filebrowser-config:/config
      - filebrowser-database:/database
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  filebrowser-config:
  filebrowser-database:
