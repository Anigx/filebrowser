version: 2
project_name: filebrowser

builds:
  - env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X github.com/filebrowser/filebrowser/v2/version.Version={{ .Version }} -X github.com/filebrowser/filebrowser/v2/version.CommitSHA={{ .ShortCommit }}
    main: main.go
    binary: filebrowser
    goos: [darwin, linux, windows, freebsd, openbsd]
    goarch: [amd64, "386", arm, arm64, riscv64]
    goarm: ["5", "6", "7"]
    ignore:
      - { goos: darwin, goarch: "386" }
      - { goos: openbsd, goarch: riscv64 }
      - { goos: windows, goarch: arm }
      - { goos: freebsd, goarch: arm }

archives:
  - name_template: "{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}-{{ .ProjectName }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: Anigx
    name: filebrowser
  header: |
    See [release notes](https://github.com/Anigx/filebrowser/blob/{{ .Tag }}/docs/releases/{{ .Tag }}.md).
  footer: |
    This is a release of the Anigx maintenance fork, not of the archived upstream.
    See [authentication setup](https://github.com/Anigx/filebrowser/blob/{{ .Tag }}/docs/authentication.md)
    and [CI and release evidence](https://github.com/Anigx/filebrowser/actions?query=branch%3A{{ .Tag }}).
